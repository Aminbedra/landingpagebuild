# LandingPageBuild.com — Astro SSR renderer (Cloudflare Pages)
#
# Deployed separately from the Worker API (../wrangler.toml). This project
# only needs read access to the KV namespace that holds published page copy —
# it never talks to D1 directly, and it calls the Worker over HTTP for
# leads + AI chat (see PUBLIC_WORKER_API_URL in .env).
#
# Only the staging KV id is provisioned so far — duplicate this file's
# binding under a `[env.production]` block once a production KV namespace
# exists, or once page copy is served from the same KV as the Worker's
# production namespace (e4a5bf2e70054fadadc41e4cdb968cd7).
#
# KNOWN ISSUE — `wrangler pages deploy` currently fails here with
# "The name 'ASSETS' is reserved in Pages projects." This is an upstream
# @astrojs/cloudflare bug (SSR + Pages), not a config error in this repo:
# https://github.com/withastro/astro/issues/16107
# The adapter auto-generates a Pages Functions worker with an `ASSETS`
# binding for any route that needs SSR (e.g. src/pages/site/[subdomain]),
# and Pages now reserves that binding name. `output: 'static'` in
# astro.config.mjs does NOT work around it — it only avoids the bug once
# the whole project has zero SSR routes, which this one doesn't (the
# subdomain renderer does real per-request KV lookups and can't be
# prerendered). Confirmed 2026-08-31: pinning @astrojs/cloudflare back to
# the last pre-bug release (12.6.13) isn't a safe fix either — it requires
# astro ^5.7.0, two majors behind this project's astro@7.
# Revisit once upstream ships a fix, and remove this note then.

name = "landingpagebuild-astro-staging"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "KV"
id = "3f5a4a30c4164a948a56cadd21c25d49"
# `remote = true` + the adapter's `remoteBindings: true` (astro.config.mjs)
# make `astro dev` read the real staging namespace instead of an empty
# local emulation of it.
remote = true
