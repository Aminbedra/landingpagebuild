# LandingPageBuild.com — Astro SSR renderer (Cloudflare Worker)
#
# Deployed as a genuine Cloudflare Worker (`wrangler deploy`), not a Pages
# project — deliberately switched away from Pages in Phase 4.
#
# FORMER ISSUE (resolved by this switch, not worked around) — `wrangler
# pages deploy`/`wrangler pages dev` failed here with "The name 'ASSETS'
# is reserved in Pages projects" (withastro/astro#16107). That error comes
# from wrangler's Pages-specific config validator, not from anything wrong
# with the build: @astrojs/cloudflare v14 (this project's version) always
# produces a plain Workers-shaped bundle regardless of deploy target —
# `main` pointing at dist/server/entry.mjs, a static-assets binding named
# `ASSETS` at dist/client (see dist/server/wrangler.json after a build).
# Pages reserves that binding name for its own implicit assets handling;
# a real Worker's Static Assets feature does not — it's the conventional
# name for exactly this. So the fix is deploying as a Worker (this file),
# not finding a workaround for Pages. (There is no `mode: 'advanced'` /
# `mode: 'directory'` option on this adapter version to reach for instead —
# that was an older @astrojs/cloudflare API; v14 dropped the Pages/Workers
# distinction at the adapter level entirely in favor of always-Workers.)
#
# This project only needs read access to the KV namespace that holds
# published market copy — it never talks to D1 directly, and it calls the
# Worker API over HTTP for leads + AI chat (see PUBLIC_WORKER_API_URL in
# .env).

name = "landingpagebuild-astro-staging"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# `main` and [assets] are deliberately NOT set here — dist/server/entry.mjs
# doesn't exist until after `astro build` runs, and @cloudflare/vite-plugin
# (which the adapter is built on) validates wrangler.toml's `main` field
# against the filesystem even during `astro build` itself, not just at
# deploy time — a config-time `main` here would break every clean build.
# Supplied via CLI instead, at deploy time only: see package.json's
# "deploy" script (`wrangler deploy dist/server/entry.mjs --assets=dist/client`).

[[kv_namespaces]]
binding = "KV"
id = "3f5a4a30c4164a948a56cadd21c25d49"
# `remote = true` + the adapter's `remoteBindings: true` (astro.config.mjs)
# make `astro dev` read the real staging namespace instead of an empty
# local emulation of it. Not used by `wrangler deploy` itself.
remote = true

# Custom Domains (not Routes) — Cloudflare provisions DNS + SSL
# automatically for these on `wrangler deploy`, no manual CNAME needed.
#
# Priority 2, Part A, Step 3 — moved off landingpagbuild.com (the typo
# domain). Per ARCHITECTURE.md's "Staging vs Production", that domain is
# a 301-redirect-to-production domain only, not a staging environment —
# landingpagbuild.com was only ever used here because nothing had
# resolved the ambiguity yet (see this file's history). The real staging
# domain is staging.landingpagebuild.com. Confirmed landingpagebuild.com
# is an active zone on this Cloudflare account (dig NS returned
# dom.ns.cloudflare.com/nelly.ns.cloudflare.com) before making this
# change — staging.landingpagebuild.com itself has no DNS record yet,
# same as uk.landingpagbuild.com had none before its first deploy;
# Custom Domains provisions it on `wrangler deploy`, same mechanism.
#
# The actual 301 redirect from landingpagbuild.com to production is a
# separate, zone-level action (a Cloudflare Redirect Rule, not anything
# expressible in this file) — deliberately not set up in this pass, since
# it's a production-facing action and this pass is staging-only. Its
# Custom Domain routes are removed below rather than left dangling.
[[routes]]
pattern = "uk.staging.landingpagebuild.com"
custom_domain = true

[[routes]]
pattern = "de.staging.landingpagebuild.com"
custom_domain = true

[[routes]]
pattern = "fr.staging.landingpagebuild.com"
custom_domain = true

# ── Production ──────────────────────────────────────────────────────────────
# Config only — not deployed by this change. wrangler deploy --env production
# is the command that would activate this; nothing here runs it.
#
# NAMING GOTCHA worth knowing before anyone runs a bare `wrangler deploy` in
# this directory: unlike the root Worker's wrangler.toml (where the
# unprefixed/top-level config IS production and [env.staging] is the named
# extra environment), THIS file's top-level config is staging
# (name = "landingpagebuild-astro-staging" above) and production only exists
# as the named [env.production] block below. A bare `wrangler deploy` here
# deploys staging, not production — always pass --env production explicitly
# for this app. Not restructured to match the root Worker's convention in
# this pass, since that's a bigger change than "add production config."
[env.production]
name = "landingpagebuild-astro"

[[env.production.kv_namespaces]]
binding = "KV"
id = "e4a5bf2e70054fadadc41e4cdb968cd7"
# Same remote-dev convenience as the staging binding above — lets
# `wrangler dev --env production` (if anyone ever runs it) read the real
# PROD_KV namespace instead of an empty local emulation.
remote = true

# market.landingpagebuild.com custom domains, same auto-provisioning
# mechanism as the staging routes above (confirmed landingpagebuild.com is
# an active zone on this account — see the staging routes' comment).
[[env.production.routes]]
pattern = "uk.landingpagebuild.com"
custom_domain = true

[[env.production.routes]]
pattern = "de.landingpagebuild.com"
custom_domain = true

[[env.production.routes]]
pattern = "fr.landingpagebuild.com"
custom_domain = true

# Root/apex domain — requested as "serves as platform homepage." Flagging
# before this goes anywhere near a deploy: astro/src/lib/marketConfig.ts's
# marketFromHost() has no concept of a homepage — any host that isn't a
# recognized {market}.<base domain> (including a bare apex with no
# subdomain at all) falls back to DEFAULT_MARKET ('uk'). Routing the apex
# here today would not serve a distinct platform homepage; it would
# silently serve the UK market's config:uk copy at the root domain. No
# code change was made to fix this — it's config-only scope for this
# pass — but deploying this specific route without addressing that first
# would ship confusing, not missing, behavior. See STATUS.md.
[[env.production.routes]]
pattern = "landingpagebuild.com"
custom_domain = true
