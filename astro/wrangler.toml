# LandingPageBuild.com — Astro SSR renderer (Cloudflare Worker)
#
# Deployed as a genuine Cloudflare Worker (`wrangler deploy`), not a Pages
# project — deliberately switched away from Pages in Phase 4.
#
# FORMER ISSUE (resolved by this switch, not worked around) — `wrangler
# pages deploy`/`wrangler pages dev` failed here with "The name 'ASSETS'
# is reserved in Pages projects" (withastro/astro#16107). That error comes
# from wrangler's Pages-specific config validator, not from anything wrong
# with the build: @astrojs/cloudflare v14 (this project's version) always
# produces a plain Workers-shaped bundle regardless of deploy target —
# `main` pointing at dist/server/entry.mjs, a static-assets binding named
# `ASSETS` at dist/client (see dist/server/wrangler.json after a build).
# Pages reserves that binding name for its own implicit assets handling;
# a real Worker's Static Assets feature does not — it's the conventional
# name for exactly this. So the fix is deploying as a Worker (this file),
# not finding a workaround for Pages. (There is no `mode: 'advanced'` /
# `mode: 'directory'` option on this adapter version to reach for instead —
# that was an older @astrojs/cloudflare API; v14 dropped the Pages/Workers
# distinction at the adapter level entirely in favor of always-Workers.)
#
# This project only needs read access to the KV namespace that holds
# published market copy — it never talks to D1 directly, and it calls the
# Worker API over HTTP for leads + AI chat (see PUBLIC_WORKER_API_URL in
# .env).

name = "landingpagebuild-astro-staging"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# `main` and [assets] are deliberately NOT set here — dist/server/entry.mjs
# doesn't exist until after `astro build` runs, and @cloudflare/vite-plugin
# (which the adapter is built on) validates wrangler.toml's `main` field
# against the filesystem even during `astro build` itself, not just at
# deploy time — a config-time `main` here would break every clean build.
# Supplied via CLI instead, at deploy time only: see package.json's
# "deploy" script (`wrangler deploy dist/server/entry.mjs --assets=dist/client`).

[[kv_namespaces]]
binding = "KV"
id = "3f5a4a30c4164a948a56cadd21c25d49"
# `remote = true` + the adapter's `remoteBindings: true` (astro.config.mjs)
# make `astro dev` read the real staging namespace instead of an empty
# local emulation of it. Not used by `wrangler deploy` itself.
remote = true

# Custom Domains (not Routes) — Cloudflare provisions DNS + SSL
# automatically for these on `wrangler deploy`, no manual CNAME needed.
# Requires an active Cloudflare zone for landingpagbuild.com in this
# account; if the zone doesn't exist this fails cleanly at deploy time
# rather than silently doing nothing, which is the actual test of whether
# that domain is real (unverified as of this pass — see conversation).
[[routes]]
pattern = "uk.landingpagbuild.com"
custom_domain = true

[[routes]]
pattern = "de.landingpagbuild.com"
custom_domain = true

[[routes]]
pattern = "fr.landingpagbuild.com"
custom_domain = true
