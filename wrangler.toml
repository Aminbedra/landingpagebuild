name = "landingpagebuild-worker"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Production ──────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "lpb-prod-db"
database_id = "05b8b59e-ae13-442c-bef5-38bb3515a037"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "KV"
id = "e4a5bf2e70054fadadc41e4cdb968cd7"

[[kv_namespaces]]
binding = "SESSIONS"
id = "d9c3135ef13a4923ad6f3eea4eef081d"

# R2 (Phase 6 — Media Library). R2 wasn't enabled on this account until
# now (confirmed via API: 403 "Please enable R2 through the Cloudflare
# Dashboard" — a one-time dashboard + billing step, not something any
# tool/API can do). Bucket must exist (`wrangler r2 bucket create
# landingpagebuild-media-production`) before this binding will resolve.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "landingpagebuild-media-production"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://landingpagebuild.com"

# Config only — not deployed by this change. `wrangler deploy` (no --env,
# since top-level in this file IS production) is what would activate this.
# Same Custom Domain mechanism as the staging route below — confirmed
# landingpagebuild.com is an active zone on this account first (dig NS).
[[routes]]
pattern = "api.landingpagebuild.com"
custom_domain = true

# ── Staging ──────────────────────────────────────────────────────────────────

[env.staging]
name = "landingpagebuild-worker-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "lpb-staging-db"
database_id = "98dc2329-0e0c-4fcb-9871-46a553f2131d"
migrations_dir = "worker/migrations"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "3f5a4a30c4164a948a56cadd21c25d49"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "d9c3135ef13a4923ad6f3eea4eef081d"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "landingpagebuild-media-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://staging.landingpagebuild.com"

# Priority 2, Part A, Step 4 (staging-first — see ARCHITECTURE.md and the
# PR this landed in for why production's route isn't added yet). Same
# Custom Domain mechanism as astro/wrangler.toml's market routes —
# Cloudflare provisions DNS + SSL on `wrangler deploy`, confirmed
# landingpagebuild.com is an active zone on this account first (dig NS).
# Until this deploys, the Worker API stays reachable only at its
# *.workers.dev URL — PUBLIC_WORKER_API_URL in astro/.env and admin/.env
# only get switched over to this domain once it's confirmed live.
[[env.staging.routes]]
pattern = "api.staging.landingpagebuild.com"
custom_domain = true
